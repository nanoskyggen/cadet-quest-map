<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a2a18"/><stop offset="1" stop-color="#0d1408"/>
    </linearGradient>
  </defs>
  <rect width="400" height="280" fill="url(#bg4)"/>
  <!-- ground -->
  <rect x="0" y="230" width="400" height="50" fill="#152010"/>
  <!-- prone shooter silhouette -->
  <g transform="translate(100,200)">
    <ellipse cx="80" cy="20" rx="100" ry="14" fill="#4a6a2a"/>
    <circle cx="150" cy="14" r="12" fill="#5a7a3a"/>
    <rect x="140" y="2" width="20" height="6" fill="#3a4e28" rx="2"/>
    <!-- rifle -->
    <rect x="160" y="18" width="140" height="6" fill="#2a2a1a" rx="1"/>
    <rect x="280" y="14" width="20" height="6" fill="#5a5a4a" rx="1"/>
    <!-- elbow support -->
    <ellipse cx="30" cy="16" rx="16" ry="10" fill="#3a5a1a" opacity="0.7"/>
  </g>
  <!-- sight alignment diagram -->
  <g transform="translate(200,80)">
    <text x="0" y="-15" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#b8d97a">SIGHT ALIGNMENT</text>
    <rect x="-30" y="0" width="60" height="24" fill="none" stroke="#9ab36a" stroke-width="2" rx="3"/>
    <circle cx="0" cy="12" r="6" fill="none" stroke="#c9a227" stroke-width="2"/>
    <circle cx="0" cy="12" r="2" fill="#ffd655"/>
    <text x="0" y="42" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#9ab36a">rear sight | front aperture | bull</text>
  </g>
  <text x="200" y="265" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#9ab36a" opacity="0.7">Prone Position &amp; Sight Alignment</text>
</svg>
