<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg8" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a2014"/><stop offset="1" stop-color="#0d1008"/>
    </linearGradient>
  </defs>
  <rect width="400" height="280" fill="url(#bg8)"/>
  <!-- topographical map -->
  <rect x="40" y="30" width="320" height="200" fill="#1a2a14" stroke="#9ab36a" stroke-width="2" rx="6"/>
  <!-- contour lines -->
  <g stroke="#8a7a3a" stroke-width="1" fill="none" opacity="0.6">
    <ellipse cx="140" cy="120" rx="30" ry="20"/>
    <ellipse cx="140" cy="120" rx="50" ry="35"/>
    <ellipse cx="140" cy="120" rx="70" ry="50"/>
    <ellipse cx="280" cy="160" rx="20" ry="15"/>
    <ellipse cx="280" cy="160" rx="35" ry="25"/>
  </g>
  <!-- grid lines -->
  <g stroke="#5a7a3a" stroke-width="0.5" opacity="0.4">
    <line x1="40" y1="80" x2="360" y2="80"/><line x1="40" y1="130" x2="360" y2="130"/><line x1="40" y1="180" x2="360" y2="180"/>
    <line x1="100" y1="30" x2="100" y2="230"/><line x1="160" y1="30" x2="160" y2="230"/><line x1="220" y1="30" x2="220" y2="230"/><line x1="280" y1="30" x2="280" y2="230"/>
  </g>
  <!-- margin labels -->
  <text x="200" y="22" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#c9a227" font-weight="bold">SCALE 1:50000  |  CONTOUR INTERVAL 10m</text>
  <text x="200" y="248" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#9ab36a">Declination: Grid N ↔ Magnetic N</text>
  <text x="200" y="265" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#9ab36a" opacity="0.7">Map Marginal Information</text>
</svg>
