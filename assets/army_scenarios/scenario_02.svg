<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a2414"/><stop offset="1" stop-color="#0d1408"/>
    </linearGradient>
  </defs>
  <rect width="400" height="280" fill="url(#bg2)"/>
  <!-- range bench -->
  <rect x="20" y="220" width="360" height="40" fill="#2a3a1a" opacity="0.6"/>
  <rect x="20" y="215" width="360" height="8" fill="#3a4e28"/>
  <!-- air rifle -->
  <g transform="translate(120,180)">
    <rect x="0" y="0" width="160" height="12" fill="#3a3a2a" rx="2"/>
    <rect x="0" y="2" width="20" height="8" fill="#6b8e23" rx="1"/>
    <rect x="20" y="-4" width="80" height="6" fill="#2a2a1a" rx="1"/>
    <rect x="60" y="12" width="20" height="30" fill="#4a4a3a" rx="2"/>
    <circle cx="70" cy="20" r="4" fill="#1a1a0a"/>
    <rect x="140" y="-8" width="14" height="8" fill="#5a5a4a" rx="1"/>
    <rect x="100" y="12" width="12" height="22" fill="#3a3a2a" rx="1"/>
  </g>
  <!-- labels -->
  <line x1="130" y1="170" x2="130" y2="150" stroke="#9ab36a" stroke-width="1" opacity="0.5"/>
  <text x="130" y="145" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#b8d97a">butt plate</text>
  <line x1="200" y1="170" x2="200" y2="150" stroke="#9ab36a" stroke-width="1" opacity="0.5"/>
  <text x="200" y="145" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#b8d97a">safety catch</text>
  <line x1="265" y1="165" x2="265" y2="145" stroke="#9ab36a" stroke-width="1" opacity="0.5"/>
  <text x="265" y="140" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#b8d97a">front sight</text>
  <text x="200" y="265" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#9ab36a" opacity="0.7">Daisy 853C Parts</text>
</svg>
