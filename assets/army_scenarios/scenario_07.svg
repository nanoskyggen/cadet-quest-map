<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg7" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a2214"/><stop offset="1" stop-color="#0d1208"/>
    </linearGradient>
  </defs>
  <rect width="400" height="280" fill="url(#bg7)"/>
  <!-- three layers stacked -->
  <g transform="translate(120,60)">
    <!-- outer shell -->
    <rect x="0" y="0" width="160" height="30" fill="#3a4e28" rx="6" opacity="0.85"/>
    <text x="80" y="20" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#dffce0" font-weight="bold">OUTER — Shell (wind/waterproof)</text>
    <!-- insulating -->
    <rect x="10" y="34" width="140" height="30" fill="#5a7a3a" rx="6" opacity="0.85"/>
    <text x="80" y="54" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#dffce0" font-weight="bold">INSULATING — Fleece</text>
    <!-- base -->
    <rect x="20" y="68" width="120" height="30" fill="#6b8e23" rx="6" opacity="0.85"/>
    <text x="80" y="88" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#04140a" font-weight="bold">BASE — Synthetic/Wool</text>
  </g>
  <!-- sleeping bag -->
  <g transform="translate(60,180)">
    <rect x="0" y="0" width="100" height="40" fill="#2a3a1a" rx="10"/>
    <text x="50" y="25" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#9ab36a">Synthetic Bag</text>
  </g>
  <!-- temperature -->
  <text x="320" y="200" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#57e8ff" font-weight="bold">2°C</text>
  <text x="320" y="215" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#9fbdd2">overnight</text>
  <text x="200" y="265" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#9ab36a" opacity="0.7">Field Layering System</text>
</svg>
