<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg6" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1e14"/><stop offset="1" stop-color="#0d0f08"/>
    </linearGradient>
  </defs>
  <rect width="400" height="280" fill="url(#bg6)"/>
  <!-- rank insignia: three pips -->
  <g transform="translate(170,60)">
    <rect x="0" y="0" width="14" height="14" fill="#c9a227" stroke="#9ab36a" stroke-width="1" rx="2"/>
    <rect x="20" y="0" width="14" height="14" fill="#c9a227" stroke="#9ab36a" stroke-width="1" rx="2"/>
    <rect x="40" y="0" width="14" height="14" fill="#c9a227" stroke="#9ab36a" stroke-width="1" rx="2"/>
    <text x="27" y="30" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#c9a227" font-weight="bold">CAPTAIN</text>
  </g>
  <!-- cadet saluting -->
  <g transform="translate(200,170)">
    <ellipse cx="0" cy="10" rx="18" ry="34" fill="#4a6a2a"/>
    <circle cx="0" cy="-28" r="12" fill="#6b8e23"/>
    <rect x="-10" y="-40" width="20" height="8" fill="#3a4e28" rx="2"/>
    <!-- right arm saluting -->
    <rect x="8" y="-25" width="6" height="28" fill="#4a6a2a" rx="2" transform="rotate(-35,11,-25)"/>
    <circle cx="-2" cy="-38" r="4" fill="#5a7a3a"/>
  </g>
  <!-- officer approaching -->
  <g transform="translate(300,165)">
    <ellipse cx="0" cy="10" rx="18" ry="34" fill="#3a5a1a" opacity="0.6"/>
    <circle cx="0" cy="-28" r="12" fill="#5a7a1a" opacity="0.6"/>
  </g>
  <text x="200" y="265" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#9ab36a" opacity="0.7">Ranks &amp; Compliments</text>
</svg>
