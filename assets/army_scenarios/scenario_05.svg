<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a2014"/><stop offset="1" stop-color="#0d1008"/>
    </linearGradient>
  </defs>
  <rect width="400" height="280" fill="url(#bg5)"/>
  <!-- range flag red -->
  <rect x="40" y="40" width="6" height="120" fill="#3a4e28"/>
  <polygon points="46,40 90,55 46,70" fill="#ff6876"/>
  <text x="70" y="30" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#ff6876" font-weight="bold">CEASE FIRE</text>
  <!-- command box -->
  <rect x="120" y="90" width="260" height="100" fill="#0d1808" stroke="#9ab36a" stroke-width="2" rx="10" opacity="0.9"/>
  <text x="250" y="115" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#c9a227" font-weight="bold">RANGE COMMANDS</text>
  <text x="140" y="135" font-family="sans-serif" font-size="9" fill="#b8d97a">"Relay, load"</text>
  <text x="140" y="150" font-family="sans-serif" font-size="9" fill="#b8d97a">"Relay, load, commence fire"</text>
  <text x="140" y="165" font-family="sans-serif" font-size="9" fill="#ff6876" font-weight="bold">"Relay, CEASE FIRE"</text>
  <text x="140" y="180" font-family="sans-serif" font-size="9" fill="#b8d97a">"Relay, resume fire"</text>
  <!-- ground -->
  <rect x="0" y="220" width="400" height="60" fill="#152010"/>
  <text x="200" y="265" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#9ab36a" opacity="0.7">Range Commands &amp; Fire Discipline</text>
</svg>
