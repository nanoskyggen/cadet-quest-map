<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg9" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a2014"/><stop offset="1" stop-color="#0d1008"/>
    </linearGradient>
  </defs>
  <rect width="400" height="280" fill="url(#bg9)"/>
  <!-- map area -->
  <rect x="30" y="20" width="340" height="210" fill="#1a2a14" stroke="#9ab36a" stroke-width="2" rx="6"/>
  <!-- steep slope: close contours (east) -->
  <g stroke="#8a7a3a" stroke-width="1.5" fill="none" opacity="0.7">
    <path d="M250,40 Q255,100 250,160"/>
    <path d="M260,40 Q266,100 260,160"/>
    <path d="M270,40 Q277,100 270,160"/>
    <path d="M280,40 Q288,100 280,160"/>
    <path d="M290,40 Q299,100 290,160"/>
  </g>
  <!-- gentle slope: wide contours (north) -->
  <g stroke="#8a7a3a" stroke-width="1" fill="none" opacity="0.5">
    <path d="M50,50 Q120,60 180,55"/>
    <path d="M50,80 Q120,95 180,85"/>
  </g>
  <!-- spur: bulging outward -->
  <g stroke="#c9a227" stroke-width="1.5" fill="none" opacity="0.7">
    <path d="M150,200 Q170,170 150,140"/>
    <path d="M160,200 Q185,170 160,140"/>
  </g>
  <!-- re-entrant: bending inward -->
  <g stroke="#57e8ff" stroke-width="1.5" fill="none" opacity="0.6">
    <path d="M100,200 Q90,170 100,140"/>
    <path d="M110,200 Q95,170 110,140"/>
  </g>
  <!-- labels -->
  <text x="280" y="35" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#ff6876">STEEP</text>
  <text x="120" y="45" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#b8d97a">GENTLE</text>
  <text x="155" y="135" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#c9a227">SPUR</text>
  <text x="100" y="135" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#57e8ff">RE-ENTRANT</text>
  <text x="200" y="265" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#9ab36a" opacity="0.7">Contour Lines &amp; Terrain</text>
</svg>
