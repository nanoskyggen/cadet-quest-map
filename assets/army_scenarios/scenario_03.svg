<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1a14"/><stop offset="1" stop-color="#0d0d08"/>
    </linearGradient>
  </defs>
  <rect width="400" height="280" fill="url(#bg3)"/>
  <!-- range floor -->
  <rect x="0" y="230" width="400" height="50" fill="#1a2218"/>
  <!-- rifle case open -->
  <rect x="60" y="200" width="280" height="50" fill="#2a3a1a" rx="4"/>
  <rect x="60" y="200" width="280" height="6" fill="#3a4e28" rx="2"/>
  <!-- rifle in case -->
  <rect x="90" y="218" width="220" height="8" fill="#3a3a2a" rx="2"/>
  <rect x="90" y="220" width="20" height="6" fill="#6b8e23" rx="1"/>
  <!-- safety rod -->
  <rect x="80" y="210" width="240" height="4" fill="#e8a020" rx="2"/>
  <!-- safety indicator -->
  <circle cx="200" cy="180" r="14" fill="#1a1a0a" stroke="#9ab36a" stroke-width="2"/>
  <text x="200" y="184" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#b8d97a" font-weight="bold">SAFE</text>
  <text x="200" y="160" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#c9a227">Safety Catch: ON (Black)</text>
  <text x="200" y="265" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#9ab36a" opacity="0.7">Range Safety Protocol</text>
</svg>
