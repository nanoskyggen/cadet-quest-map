  <main class="app">
    <nav class="top-nav">

    <section class="hero">

        <p class="eyebrow" id="eyebrow"></p>
        <h1 id="pageTitle"></h1>
        <p class="subtitle" id="subtitle"></p>
      </article>
      <aside class="panel score-card">
        <h2 id="scoreTitle"></h2>
        <div class="progress-shell"><div class="progress-bar" id="progressBar"></div></div>

      </article>
      <aside class="panel mission-panel">
        <h2 id="missionTitle"></h2>
        <p class="brief" id="brief"></p>
        <ul class="mission-list" id="missionList"></ul>
        <div class="feedback" id="feedback"></div>
        <div class="challenge-card" id="challengeCard"><h3 id="challengeTitle"></h3><div class="choice-grid" id="choiceGrid"></div></div>
        <div class="tools"><button class="btn" id="hintBtn" type="button" data-i18n="Give Hint">Give Hint</button><button class="btn secondary" id="autoDemo" type="button" data-i18n="Auto Demo Correct Path">Auto Demo Correct Path</button></div>
        <div class="inventory" id="inventory"></div>
      </aside>
    </section>
  </main>
