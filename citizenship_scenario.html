<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title></title>
  <link rel="stylesheet" href="scenario_page.css" />
  <link rel="stylesheet" href="i18n.css" />
  <link rel="stylesheet" href="cadet_hq.css?v=1" />
  <link rel="stylesheet" href="mobile-fix.css" />
</head>
<body>
  <main class="app">
    <nav class="top-nav">
      <a class="back-link" href="index.html" data-i18n="← Back to Quest Map">← Back to Quest Map</a>
      <button class="small-btn" id="resetGame" type="button" data-i18n="Reset Scenario">Reset Scenario</button>
          <div id="langSwitcher" class="lang-switcher lang-switcher-inline"></div>
</nav>
    <section class="hero">
      <article class="panel title-card">
        <p class="eyebrow" id="eyebrow"></p>
        <h1 id="pageTitle"></h1>
        <p class="subtitle" id="subtitle"></p>
      </article>
      <aside class="panel score-card">
        <h2 id="scoreTitle"></h2>
        <div class="progress-shell"><div class="progress-bar" id="progressBar"></div></div>
        <div class="score-row">
          <span><strong id="score">0</strong>/100 points</span>
          <span><strong id="foundCount">0</strong>/<strong id="totalCount">4</strong> complete</span>
        </div>
      </aside>
    </section>
    <section class="game">
      <article class="panel scene-panel">
        <div class="scene-title"><h2 id="sceneTitle"></h2><span class="small-btn" id="stageLabel"></span></div>
        <div class="scene-stage" aria-label="Interactive scenario scene"><div class="scene-art" id="sceneArt"></div></div>
      </article>
      <aside class="panel mission-panel">
        <h2 id="missionTitle"></h2>
        <p class="brief" id="brief"></p>
        <ul class="mission-list" id="missionList"></ul>
        <div class="feedback" id="feedback"></div>
        <div class="challenge-card" id="challengeCard"><h3 id="challengeTitle"></h3><div class="choice-grid" id="choiceGrid"></div></div>
        <div class="tools"><button class="btn" id="hintBtn" type="button" data-i18n="Give Hint">Give Hint</button><button class="btn secondary" id="autoDemo" type="button" data-i18n="Auto Demo Correct Path">Auto Demo Correct Path</button></div>
        <div class="inventory" id="inventory"></div>
      </aside>
    </section>
  </main>
  <div class="badge-unlock" id="badgeUnlock" aria-hidden="true"><img id="badgeImage" alt="badge" /><h2 data-i18n="Badge Unlocked!">Badge Unlocked!</h2><p id="badgeText"></p></div>
  <script>window.SCENARIO_CONFIG = {"badgeId": 4, "storageKey": "scenario4_citizenship", "pageTitle": "Badge 4 Interactive Citizenship and Teamwork", "eyebrow": "Badge 4 Scenario • Citizenship & Teamwork", "title": "Community Teamwork Quest", "subtitle": "Make choices that support teammates, community service, and respectful participation.", "scoreTitle": "Teamwork Score", "sceneTitle": "Community Service Garden", "stageLabel": "Click teamwork moments", "theme": ["#35a75a", "#f5c84c"], "badge": "assets/badges/badge_04_citizenship.png", "brief": "Your section is helping with a community garden task. Complete the teamwork moments by choosing supportive, respectful actions.", "missionSteps": ["Notice the need.", "Support the teammate.", "Keep the community goal in mind.", "Reflect on impact."], "startPrompt": "Click a glowing teamwork moment to begin.", "unlockText": "Citizenship & Teamwork badge unlocked — community mission complete.", "sceneObjects": [{"x": "10%", "y": "14%", "size": "big", "html": "Garden<br>Plot"}, {"x": "62%", "y": "15%", "size": "big", "html": "Tool<br>Station"}, {"x": "12%", "y": "70%", "size": "med", "html": "Team<br>Task"}, {"x": "68%", "y": "70%", "size": "med", "html": "Reflection<br>Bench"}], "tasks": [{"id": "support", "label": "Support a Teammate", "marker": "1", "x": "22%", "y": "32%", "clue": "A teammate is falling behind and looks frustrated.", "question": "What should you do?", "hint": "Support should be respectful and practical.", "choices": [{"text": "Offer help, break the task into steps, and encourage them respectfully.", "correct": true, "feedback": "Correct. You supported the person and the mission."}, {"text": "Make fun of them so they work faster.", "correct": false, "feedback": "Wrong response. That damages trust and teamwork."}, {"text": "Take over without explaining anything.", "correct": false, "feedback": "Not ideal. Helping should include the teammate."}]}, {"id": "tools", "label": "Share Tools Fairly", "marker": "2", "x": "76%", "y": "34%", "clue": "Only one set of tools is available and two groups need it.", "question": "Which choice shows teamwork?", "hint": "Fairness and communication matter.", "choices": [{"text": "Create a quick rotation so both groups can keep working.", "correct": true, "feedback": "Correct. Fair sharing keeps the mission moving."}, {"text": "Hide the tools for your group only.", "correct": false, "feedback": "Wrong response. That is not community-minded."}, {"text": "Argue until the task time runs out.", "correct": false, "feedback": "Not quite. Conflict should be solved constructively."}]}, {"id": "community", "label": "Community Impact", "marker": "3", "x": "25%", "y": "78%", "clue": "A community member thanks the team for helping.", "question": "What response best reflects citizenship?", "hint": "Respect and humility are part of service.", "choices": [{"text": "Thank them and explain that the team was glad to support the community.", "correct": true, "feedback": "Correct. This is respectful and service-minded."}, {"text": "Say you only helped because of the badge.", "correct": false, "feedback": "Wrong response. Badges represent learning, not the only reason to serve."}, {"text": "Ignore them and walk away.", "correct": false, "feedback": "Not quite. Respectful communication matters."}]}, {"id": "reflect", "label": "Service Reflection", "marker": "4", "x": "78%", "y": "78%", "clue": "The task is done and the section writes a reflection.", "question": "Which reflection is strongest?", "hint": "Reflection connects action to impact.", "choices": [{"text": "Describe what was done, who it helped, and what the team learned.", "correct": true, "feedback": "Correct. That captures action, impact, and learning."}, {"text": "Write only “finished.”", "correct": false, "feedback": "Wrong response. That misses the learning."}, {"text": "List only complaints about the work.", "correct": false, "feedback": "Not quite. Honest reflection can include challenges, but should include learning."}]}]};</script>
  <script src="translations_en.js"></script>
  <script src="translations_fr.js?v=9"></script>
  <script src="i18n.js"></script>
  <script src="cadet_hq.js?v=2"></script>
  <script src="scenario_page.js"></script>
</body>
</html>
