<body>
  <main class="app">
    <nav class="top-nav">
      <a class="back-link" href="index.html" data-i18n="← Back to Quest Map">← Back to Quest Map</a>
      <button class="small-btn" id="resetGame" type="button" data-i18n="Reset Scenario">Reset Scenario</button>
          <div id="langSwitcher" class="lang-switcher lang-switcher-inline"></div>
</nav>
    <section class="hero">
      <article class="panel title-card">
        <p class="eyebrow" id="eyebrow"></p>
        <h1 id="pageTitle"></h1>
        <p class="subtitle" id="subtitle"></p>
      </article>
      <aside class="panel score-card">
        <h2 id="scoreTitle"></h2>
        <div class="progress-shell"><div class="progress-bar" id="progressBar"></div></div>
        <div class="score-row">
          <span><strong id="score">0</strong>/100 points</span>
          <span><strong id="foundCount">0</strong>/<strong id="totalCount">4</strong> complete</span>
        </div>
      </aside>
    </section>
    <section class="game">
      <article class="panel scene-panel">
        <div class="scene-title"><h2 id="sceneTitle"></h2><span class="small-btn" id="stageLabel"></span></div>
        <div class="scene-stage" aria-label="Interactive scenario scene"><div class="scene-art" id="sceneArt"></div></div>
      </article>
      <aside class="panel mission-panel">
        <h2 id="missionTitle"></h2>
        <p class="brief" id="brief"></p>
        <ul class="mission-list" id="missionList"></ul>
        <div class="feedback" id="feedback"></div>
        <div class="challenge-card" id="challengeCard"><h3 id="challengeTitle"></h3><div class="choice-grid" id="choiceGrid"></div></div>
        <div class="tools"><button class="btn" id="hintBtn" type="button" data-i18n="Give Hint">Give Hint</button><button class="btn secondary" id="autoDemo" type="button" data-i18n="Auto Demo Correct Path">Auto Demo Correct Path</button></div>
        <div class="inventory" id="inventory"></div>
      </aside>
    </section>
  </main>
  <div class="badge-unlock" id="badgeUnlock" aria-hidden="true"><img id="badgeImage" alt="badge" /><h2 data-i18n="Badge Unlocked!">Badge Unlocked!</h2><p id="badgeText"></p></div>

%", "clue": "The map shows two routes to the next station.", "question": "Which route choice is best?", "hint": "Safe and clear beats fastest if the fast route is risky.", "choices": [{"text": "Choose the route with clear checkpoints and fewer hazards.", "correct": true, "feedback": "Correct. Safe navigation uses checkpoints and hazard awareness."}, {"text": "Choose the shortest line even if it crosses unsafe ground.", "correct": false, "feedback": "Wrong response. Shortest is not always safest."}, {"text": "Ignore the map and follow instinct only.", "correct": false, "feedback": "Not quite. Use navigation tools."}]}, {"id": "pack", "label": "Rucksack Check", "marker": "3", "x": "25%", "y": "78%", "clue": "Your pack needs a quick check before moving.", "question": "Which pack choice is best?", "hint": "Think essentials, balance, and access.", "choices": [{"text": "Pack essentials, balance weight, and keep needed items accessible.", "correct": true, "feedback": "Correct. Good packing supports safe movement."}, {"text": "Pack every possible item until the bag is overloaded.", "correct": false, "feedback": "Wrong response. Overpacking can slow and tire the team."}, {"text": "Carry nothing because teammates can share.", "correct": false, "feedback": "Not quite. Each cadet has preparation responsibility."}]}, {"id": "movement", "label": "Team Movement", "marker": "4", "x": "78%", "y": "78%", "clue": "Your section moves to the next checkpoint.", "question": "Which movement choice is best?", "hint": "Team spacing and communication matter.", "choices": [{"text": "Move together with clear spacing, checkpoints, and leader communication.", "correct": true, "feedback": "Correct. Organized movement keeps the group together."}, {"text": "Let everyone race ahead alone.", "correct": false, "feedback": "Wrong response. The team can become separated."}, {"text": "Move silently even when someone is missing.", "correct": false, "feedback": "Not quite. Account for the team."}]}]};</scri
